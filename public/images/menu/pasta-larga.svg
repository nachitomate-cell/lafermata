<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bowl shadow -->
  <ellipse cx="100" cy="165" rx="62" ry="7" fill="rgba(0,0,0,0.35)"/>
  <!-- Bowl body (elegant ceramic, cream) -->
  <path d="M 28 90 Q 26 158 100 165 Q 174 158 172 90 Z" fill="#e2d8c8"/>
  <path d="M 36 90 Q 34 150 100 157 Q 166 150 164 90 Z" fill="#f0eadc"/>
  <!-- Bowl rim -->
  <ellipse cx="100" cy="90" rx="72" ry="14" fill="#e2d8c8"/>
  <ellipse cx="100" cy="90" rx="64" ry="10" fill="#f0eadc"/>
  <!-- Bowl rim inner line -->
  <ellipse cx="100" cy="89" rx="60" ry="9" fill="none" stroke="#c8bfae" stroke-width="1.5"/>
  <!-- Bowl highlight -->
  <ellipse cx="70" cy="88" rx="18" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(-12,70,88)"/>

  <!-- Tagliatelle nest (golden pasta) -->
  <!-- Back strands -->
  <path d="M 52 86 Q 60 118 58 148" fill="none" stroke="#d4b040" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 148 86 Q 142 115 144 148" fill="none" stroke="#d4b040" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M 62 84 Q 72 124 68 152" fill="none" stroke="#c8a030" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
  <path d="M 138 84 Q 130 120 132 150" fill="none" stroke="#c8a030" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <!-- Sauce pool (cream/butter sauce) -->
  <ellipse cx="100" cy="120" rx="40" ry="24" fill="#c89040" opacity="0.5"/>
  <ellipse cx="100" cy="118" rx="32" ry="18" fill="#d4a840" opacity="0.45"/>

  <!-- Middle pasta strands (tagliatelle ribbon style) -->
  <path d="M 68 84 Q 58 110 72 145" fill="none" stroke="#e8c858" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 78 83 Q 70 116 80 148" fill="none" stroke="#f0d060" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 88 82 Q 86 120 88 150" fill="none" stroke="#e8c858" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 100" cy="82 Q 104 118 100 150" fill="none" stroke="#f0d060" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 100 82 Q 104 118 100 150" fill="none" stroke="#f0d060" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 112 82 Q 114 116 112 148" fill="none" stroke="#e8c858" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 122 83 Q 130 114 120 148" fill="none" stroke="#f0d060" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M 132 84 Q 142 108 128 144" fill="none" stroke="#e8c858" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sauce splash (tomato or cream, here: amber/gold for burro) -->
  <ellipse cx="98" cy="108" rx="28" ry="16" fill="#d4a030" opacity="0.7"/>
  <circle cx="90" cy="105" r="8" fill="#c89028" opacity="0.65"/>
  <circle cx="110" cy="110" r="7" fill="#d4a030" opacity="0.6"/>

  <!-- Front pasta strands -->
  <path d="M 75 84 Q 64 108 76 138" fill="none" stroke="#f0d870" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 96 82 Q 93 112 95 142" fill="none" stroke="#e8c858" stroke-width="5" stroke-linecap="round"/>
  <path d="M 116 83 Q 120 108 115 138" fill="none" stroke="#f0d870" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Fresh basil leaf -->
  <ellipse cx="108" cy="100" rx="11" ry="7" fill="#1c5c24" transform="rotate(-28,108,100)"/>
  <ellipse cx="107" cy="99"  rx="11" ry="7" fill="#268030" transform="rotate(-28,107,99)"/>
  <line x1="102" y1="104" x2="114" y2="95" stroke="#145020" stroke-width="1.2" opacity="0.8"/>
  <!-- Leaf 2 -->
  <ellipse cx="88" cy="100" rx="9" ry="5.5" fill="#268030" transform="rotate(15,88,100)"/>

  <!-- Parmigiano shavings -->
  <ellipse cx="100" cy="94" rx="7" ry="3.5" fill="#f8f0d8" opacity="0.88" transform="rotate(-12,100,94)"/>
  <ellipse cx="114" cy="98" rx="6" ry="3"   fill="#f0e8d0" opacity="0.82" transform="rotate(22,114,98)"/>
  <ellipse cx="84"  cy="96" rx="5" ry="2.5" fill="#f8f0d8" opacity="0.8" transform="rotate(-5,84,96)"/>
</svg>
