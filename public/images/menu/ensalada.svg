<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Caprese salad — top down view on slate plate -->
  <!-- Plate shadow -->
  <ellipse cx="100" cy="108" rx="84" ry="10" fill="rgba(0,0,0,0.3)"/>
  <!-- White plate -->
  <circle cx="100" cy="100" r="84" fill="#f0ece0"/>
  <circle cx="100" cy="100" r="76" fill="#f8f4ea"/>
  <!-- Plate rim highlight -->
  <path d="M 36 72 Q 60 30 100 24 Q 140 18 164 54" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="5" stroke-linecap="round"/>

  <!-- Caprese arrangement (overlapping circle pattern) -->
  <!-- Bottom row -->
  <circle cx="68"  cy="115" r="18" fill="#c43020" opacity="0.92"/>
  <circle cx="100" cy="120" r="18" fill="#f2e8d0" opacity="0.96"/>
  <circle cx="132" cy="115" r="18" fill="#c43020" opacity="0.92"/>

  <!-- Middle row -->
  <circle cx="56"  cy="94"  r="18" fill="#f2e8d0" opacity="0.96"/>
  <circle cx="84"  cy="88"  r="18" fill="#c43020" opacity="0.92"/>
  <circle cx="116" cy="88"  r="18" fill="#f2e8d0" opacity="0.96"/>
  <circle cx="144" cy="94"  r="18" fill="#c43020" opacity="0.92"/>

  <!-- Top row -->
  <circle cx="68"  cy="76"  r="16" fill="#c43020" opacity="0.9"/>
  <circle cx="100" cy="70"  r="16" fill="#f2e8d0" opacity="0.95"/>
  <circle cx="132" cy="76"  r="16" fill="#c43020" opacity="0.9"/>

  <!-- Tomato details -->
  <circle cx="68"  cy="115" r="5" fill="#a01c10" opacity="0.4"/>
  <circle cx="132" cy="115" r="5" fill="#a01c10" opacity="0.4"/>
  <circle cx="84"  cy="88"  r="5" fill="#a01c10" opacity="0.4"/>
  <circle cx="144" cy="94"  r="5" fill="#a01c10" opacity="0.4"/>
  <circle cx="68"  cy="76"  r="4" fill="#a01c10" opacity="0.4"/>
  <circle cx="132" cy="76"  r="4" fill="#a01c10" opacity="0.4"/>

  <!-- Mozzarella highlights -->
  <circle cx="100" cy="118" r="5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="56"  cy="92"  r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="116" cy="86"  r="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="100" cy="68"  r="4" fill="rgba(255,255,255,0.4)"/>

  <!-- Basil leaves between slices -->
  <ellipse cx="84"  cy="112" rx="9" ry="5" fill="#228030" opacity="0.88" transform="rotate(-30,84,112)"/>
  <ellipse cx="116" cy="107" rx="8" ry="5" fill="#228030" opacity="0.85" transform="rotate(25,116,107)"/>
  <ellipse cx="100" cy="96"  rx="9" ry="5" fill="#228030" opacity="0.88" transform="rotate(-10,100,96)"/>
  <ellipse cx="68"  cy="95"  rx="7" ry="4" fill="#228030" opacity="0.82" transform="rotate(35,68,95)"/>
  <ellipse cx="132" cy="96"  rx="7" ry="4" fill="#228030" opacity="0.82" transform="rotate(-25,132,96)"/>

  <!-- Olive oil drizzle -->
  <path d="M 62 86 Q 100 75 138 88" fill="none" stroke="rgba(201,168,76,0.4)" stroke-width="3" stroke-linecap="round"/>

  <!-- Sea salt flakes -->
  <circle cx="90"  cy="105" r="1.5" fill="rgba(245,240,232,0.6)"/>
  <circle cx="112" cy="100" r="1.5" fill="rgba(245,240,232,0.6)"/>
  <circle cx="76"  cy="108" r="1.5" fill="rgba(245,240,232,0.6)"/>
</svg>
