<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Mini pizza — child-sized, cute Margherita -->
  <!-- Crust -->
  <circle cx="100" cy="108" r="70" fill="#c8944a"/>
  <!-- Char spots (few, light, kid-friendly look) -->
  <circle cx="60"  cy="58"  r="11" fill="#1a0c04" opacity="0.7"/>
  <circle cx="100" cy="44"  r="14" fill="#160a04" opacity="0.65"/>
  <circle cx="142" cy="62"  r="10" fill="#1a0c04" opacity="0.7"/>
  <circle cx="160" cy="108" r="12" fill="#160a04" opacity="0.65"/>
  <circle cx="140" cy="156" r="10" fill="#1a0c04" opacity="0.7"/>
  <circle cx="100" cy="170" r="13" fill="#160a04" opacity="0.65"/>
  <circle cx="58"  cy="155" r="10" fill="#1a0c04" opacity="0.7"/>
  <circle cx="40"  cy="108" r="11" fill="#160a04" opacity="0.65"/>
  <!-- Crust highlight -->
  <path d="M 42 78 Q 64 44 100 34 Q 136 24 158 60" fill="none" stroke="rgba(255,210,130,0.35)" stroke-width="5" stroke-linecap="round"/>
  <!-- Sauce -->
  <circle cx="100" cy="108" r="56" fill="#c43020"/>
  <!-- Cheese layer -->
  <ellipse cx="100" cy="100" rx="44" ry="34" fill="#f4eada" opacity="0.95"/>
  <!-- Extra mozzarella blobs -->
  <ellipse cx="78"  cy="116" rx="20" ry="14" fill="#f6edd8" opacity="0.92" transform="rotate(-8,78,116)"/>
  <ellipse cx="122" cy="112" rx="18" ry="13" fill="#f2e8d4" opacity="0.93" transform="rotate(6,122,112)"/>
  <ellipse cx="100" cy="128" rx="22" ry="14" fill="#f4eada" opacity="0.91"/>
  <!-- Basil heart shape (cute for kids) -->
  <ellipse cx="96"  cy="90"  rx="11" ry="7" fill="#289030" transform="rotate(-40,96,90)"/>
  <ellipse cx="104" cy="90"  rx="11" ry="7" fill="#289030" transform="rotate(40,104,90)"/>
  <path d="M 100 94 L 100 102" stroke="#289030" stroke-width="3" stroke-linecap="round"/>
  <!-- Small star accent (bambini = festive) -->
  <polygon points="100,56 102.5,63 110,63 104,67.5 106.5,74.5 100,70 93.5,74.5 96,67.5 90,63 97.5,63"
           fill="#c9a84c" opacity="0.85"/>
</svg>
