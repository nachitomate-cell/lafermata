<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Bowl shadow -->
  <ellipse cx="100" cy="165" rx="60" ry="7" fill="rgba(0,0,0,0.35)"/>
  <!-- Bowl body (white ceramic) -->
  <path d="M 30 88 Q 28 158 100 165 Q 172 158 170 88 Z" fill="#ddd5c5"/>
  <path d="M 38 88 Q 36 152 100 158 Q 164 152 162 88 Z" fill="#f2eee4"/>
  <!-- Bowl rim -->
  <ellipse cx="100" cy="88" rx="70" ry="13" fill="#ddd5c5"/>
  <ellipse cx="100" cy="88" rx="62" ry="9"  fill="#f2eee4"/>
  <ellipse cx="100" cy="87" rx="58" ry="8"  fill="none" stroke="#c8c0b0" stroke-width="1.5"/>
  <!-- Bowl highlight -->
  <ellipse cx="72" cy="87" rx="16" ry="4" fill="rgba(255,255,255,0.4)" transform="rotate(-10,72,87)"/>

  <!-- Saffron risotto (creamy golden) -->
  <ellipse cx="100" cy="118" rx="52" ry="34" fill="#d4a030"/>
  <ellipse cx="100" cy="115" rx="48" ry="30" fill="#e0b040"/>
  <!-- Risotto texture (rice grain dots) -->
  <ellipse cx="80"  cy="110" rx="6" ry="3.5" fill="#d4a030" opacity="0.6" transform="rotate(-15,80,110)"/>
  <ellipse cx="96"  cy="106" rx="6" ry="3"   fill="#d4a030" opacity="0.55" transform="rotate(8,96,106)"/>
  <ellipse cx="112" cy="110" rx="5.5" ry="3" fill="#d4a030" opacity="0.6" transform="rotate(-5,112,110)"/>
  <ellipse cx="88"  cy="120" rx="5.5" ry="3" fill="#d4a030" opacity="0.55" transform="rotate(12,88,120)"/>
  <ellipse cx="108" cy="122" rx="6"  ry="3"  fill="#d4a030" opacity="0.55" transform="rotate(-18,108,122)"/>
  <ellipse cx="78"  cy="126" rx="5"  ry="3"  fill="#d4a030" opacity="0.5" transform="rotate(5,78,126)"/>
  <ellipse cx="118" cy="126" rx="5.5" ry="3" fill="#d4a030" opacity="0.5" transform="rotate(-10,118,126)"/>

  <!-- Creamy top surface sheen -->
  <ellipse cx="94" cy="108" rx="30" ry="18" fill="#f0d878" opacity="0.35"/>
  <ellipse cx="94" cy="106" rx="18" ry="10" fill="#f8e890" opacity="0.3"/>

  <!-- Parmigiano shavings -->
  <ellipse cx="100" cy="100" rx="10" ry="4.5" fill="#f8f0d8" opacity="0.9" transform="rotate(-15,100,100)"/>
  <ellipse cx="116" cy="106" rx="8"  ry="4"   fill="#f0e8d0" opacity="0.85" transform="rotate(25,116,106)"/>
  <ellipse cx="84"  cy="104" rx="7"  ry="3.5" fill="#f8f0d8" opacity="0.82" transform="rotate(-8,84,104)"/>

  <!-- Rosemary sprig -->
  <path d="M 130 92 Q 124 108 122 128" fill="none" stroke="#3a6e28" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="126" cy="96"  rx="5" ry="2" fill="#3a7828" transform="rotate(-45,126,96)"/>
  <ellipse cx="125" cy="102" rx="5" ry="2" fill="#3a7828" transform="rotate(-42,125,102)"/>
  <ellipse cx="124" cy="108" rx="5" ry="2" fill="#3a7828" transform="rotate(-48,124,108)"/>
  <ellipse cx="123" cy="114" rx="4.5" ry="2" fill="#3a7828" transform="rotate(-44,123,114)"/>

  <!-- Saffron dots -->
  <circle cx="90" cy="112" r="2"   fill="#e8411a" opacity="0.7"/>
  <circle cx="110" cy="115" r="1.8" fill="#e8411a" opacity="0.65"/>
  <circle cx="102" cy="128" r="1.8" fill="#e8411a" opacity="0.65"/>
</svg>
