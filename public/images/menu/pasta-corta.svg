    <ellipse cx="87" cy="100" rx="5" ry="2.5" fill="#282010" opacity="0.5"/>

    <rect x="108" y="100" width="14" height="22" rx="7" fill="#f0c848"/>
    <ellipse cx="115" cy="100" rx="7" ry="4" fill="#d8a830"/>
    <ellipse cx="115" cy="122" rx="7" ry="4" fill="#d8a830"/>
    <ellipse cx="115" cy="100" rx="5" ry="2.5" fill="#282010" opacity="0.5"/>

    <rect x="126" y="105" width="14" height="22" rx="7" fill="#e8c040"/>
    <ellipse cx="133" cy="105" rx="7" ry="4" fill="#d0a028"/>
    <ellipse cx="133" cy="127" rx="7" ry="4" fill="#d0a028"/>
    <ellipse cx="133" cy="105" rx="5" ry="2.5" fill="#282010" opacity="0.5"/>
