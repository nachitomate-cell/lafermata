  <rect x="71" y="120" width="14" height="22" rx="7" fill="#f4cc50"/>
  <ellipse cx="78" cy="120" rx="7" ry="4" fill="#dab030"/>
  <ellipse cx="78" cy="142" rx="7" ry="4" fill="#dab030"/>
  <ellipse cx="78" cy="120" rx="5" ry="2.5" fill="#1e180a" opacity="0.5"/>

  <rect x="93" y="115" width="14" height="22" rx="7" fill="#f0c848"/>
  <ellipse cx="100" cy="115" rx="7" ry="4" fill="#d8a830"/>
  <ellipse cx="100" cy="137" rx="7" ry="4" fill="#d8a830"/>
  <ellipse cx="100" cy="115" rx="5" ry="2.5" fill="#1e180a" opacity="0.5"/>
