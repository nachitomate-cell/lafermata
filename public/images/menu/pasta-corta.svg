  <line x1="96" y1="108" x2="107" y2="102" stroke="#1e5828" stroke-width="1.2" opacity="0.8"/>

  <!-- Parmigiano -->
  <ellipse cx="112" cy="108" rx="5" ry="2.5" fill="#f8f0d8" opacity="0.9" transform="rotate(15,112,108)"/>
  <ellipse cx="88" cy="106" rx="4" ry="2" fill="#f8f0d8" opacity="0.85" transform="rotate(-10,88,106)"/>

