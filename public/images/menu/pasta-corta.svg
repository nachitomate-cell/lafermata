<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- "Arma tu Pasta" — fork + rigatoni illustration -->

  <!-- Fork handle -->
  <rect x="92" y="140" width="16" height="46" rx="7" fill="#c9a84c"/>
  <rect x="94" y="142" width="12" height="42" rx="6" fill="#d4b455"/>
  <!-- Handle sheen -->
  <path d="M 95 146 L 95 178" stroke="rgba(255,255,255,0.25)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fork neck -->
  <rect x="95" y="116" width="10" height="26" rx="4" fill="#c9a84c"/>

  <!-- Fork head (4 tines) -->
  <rect x="90" y="88" width="4" height="30" rx="2" fill="#c9a84c"/>
  <rect x="97" y="88" width="4" height="30" rx="2" fill="#c9a84c"/>
  <rect x="104" y="88" width="4" height="30" rx="2" fill="#c9a84c"/>
  <!-- Fork base bar -->
  <rect x="88" y="112" width="24" height="6" rx="2" fill="#c9a84c"/>

  <!-- Rigatoni pieces (tube pasta, twirled on fork) -->
  <!-- Main pasta twist around fork -->
  <!-- Rigatoni 1 -->
  <ellipse cx="86" cy="80" rx="16" ry="9" fill="#f0d060" transform="rotate(-35,86,80)"/>
  <ellipse cx="86" cy="80" rx="12" ry="6" fill="#e0bc48" transform="rotate(-35,86,80)"/>
  <ellipse cx="86" cy="80" rx="7"  ry="3.5" fill="#2a1a08" opacity="0.5" transform="rotate(-35,86,80)"/>
  <!-- Rigatoni ridges -->
  <line x1="76" y1="75" x2="95" y2="84" stroke="#c8a030" stroke-width="1.5" opacity="0.6" transform="rotate(-35,86,80)"/>
  <line x1="76" y1="79" x2="95" y2="88" stroke="#c8a030" stroke-width="1.5" opacity="0.5" transform="rotate(-35,86,80)"/>

  <!-- Rigatoni 2 -->
  <ellipse cx="118" cy="74" rx="15" ry="8" fill="#f0d060" transform="rotate(25,118,74)"/>
  <ellipse cx="118" cy="74" rx="11" ry="5.5" fill="#e0bc48" transform="rotate(25,118,74)"/>
  <ellipse cx="118" cy="74" rx="6" ry="3" fill="#2a1a08" opacity="0.5" transform="rotate(25,118,74)"/>

  <!-- Rigatoni 3 (dangling, fun) -->
  <ellipse cx="78" cy="62" rx="14" ry="8" fill="#f0d060" transform="rotate(-50,78,62)"/>
  <ellipse cx="78" cy="62" rx="10" ry="5" fill="#e0bc48" transform="rotate(-50,78,62)"/>
  <ellipse cx="78" cy="62" rx="5.5" ry="2.8" fill="#2a1a08" opacity="0.5" transform="rotate(-50,78,62)"/>

  <!-- Rigatoni 4 (top right) -->
  <ellipse cx="124" cy="56" rx="13" ry="7" fill="#e8c850" transform="rotate(40,124,56)"/>
  <ellipse cx="124" cy="56" rx="9" ry="4.5" fill="#d8b840" transform="rotate(40,124,56)"/>
  <ellipse cx="124" cy="56" rx="5" ry="2.5" fill="#2a1a08" opacity="0.5" transform="rotate(40,124,56)"/>

  <!-- Sauce (pomodoro drip) -->
  <path d="M 80 86 Q 100 96 120 88" fill="none" stroke="rgba(196,48,32,0.5)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="95" cy="96" r="5" fill="#c43020" opacity="0.55"/>
  <circle cx="106" cy="90" r="4" fill="#c43020" opacity="0.5"/>

  <!-- Basil leaf (small, accent) -->
  <ellipse cx="130" cy="100" rx="9" ry="5" fill="#228830" opacity="0.85" transform="rotate(30,130,100)"/>

  <!-- "+" spark symbol (arma tu pasta = build your pasta) -->
  <circle cx="44" cy="50" r="14" fill="rgba(232,65,26,0.15)" stroke="rgba(232,65,26,0.5)" stroke-width="1.5"/>
  <line x1="44" y1="43" x2="44" y2="57" stroke="#e8411a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="37" y1="50" x2="51" y2="50" stroke="#e8411a" stroke-width="2.5" stroke-linecap="round"/>
</svg>
