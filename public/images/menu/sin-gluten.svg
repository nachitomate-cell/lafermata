<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- GF pizza — same Neapolitan style but with GF badge -->
  <!-- Crust -->
  <circle cx="100" cy="100" r="84" fill="#b07030"/>
  <!-- Char spots (smaller for GF crust which chars differently) -->
  <circle cx="55"  cy="44"  r="13" fill="#1a0c04" opacity="0.78"/>
  <circle cx="100" cy="22"  r="16" fill="#160a04" opacity="0.72"/>
  <circle cx="150" cy="48"  r="12" fill="#1a0c04" opacity="0.78"/>
  <circle cx="170" cy="100" r="14" fill="#160a04" opacity="0.72"/>
  <circle cx="148" cy="155" r="12" fill="#1a0c04" opacity="0.78"/>
  <circle cx="100" cy="174" r="15" fill="#160a04" opacity="0.72"/>
  <circle cx="50"  cy="154" r="12" fill="#1a0c04" opacity="0.78"/>
  <circle cx="30"  cy="100" r="13" fill="#160a04" opacity="0.72"/>
  <!-- Crust highlight -->
  <path d="M 28 72 Q 54 28 100 16 Q 146 4 168 44" fill="none" stroke="rgba(255,210,130,0.34)" stroke-width="5" stroke-linecap="round"/>
  <!-- Sauce -->
  <circle cx="100" cy="100" r="68" fill="#c43020"/>
  <circle cx="86"  cy="86"  r="26" fill="#a01c10" opacity="0.42"/>
  <!-- Cheese -->
  <ellipse cx="100" cy="92"  rx="30" ry="22" fill="#f4eada" opacity="0.96"/>
  <ellipse cx="72"  cy="108" rx="22" ry="16" fill="#f6edd8" opacity="0.93" transform="rotate(-10,72,108)"/>
  <ellipse cx="128" cy="104" rx="20" ry="15" fill="#f2e8d4" opacity="0.95" transform="rotate(8,128,104)"/>
  <ellipse cx="98"  cy="125" rx="24" ry="16" fill="#f4eada" opacity="0.92"/>
  <!-- Basil -->
  <ellipse cx="96"  cy="82"  rx="11" ry="7" fill="#289030" transform="rotate(-35,96,82)"/>
  <ellipse cx="124" cy="116" rx="9"  ry="6" fill="#289030" transform="rotate(20,124,116)"/>

  <!-- GF badge (top right) -->
  <circle cx="150" cy="42" r="20" fill="#0c0b09" stroke="#c9a84c" stroke-width="2"/>
  <text x="150" y="38" text-anchor="middle" font-size="8" font-weight="bold" fill="#c9a84c" font-family="sans-serif">SIN</text>
  <text x="150" y="49" text-anchor="middle" font-size="8" font-weight="bold" fill="#c9a84c" font-family="sans-serif">GLUTEN</text>
</svg>
