<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Crust ring (golden-brown Neapolitan) -->
  <circle cx="100" cy="100" r="90" fill="#b87a38"/>
  <!-- Char spots on crust -->
  <circle cx="55"  cy="42"  r="16" fill="#1a0c04" opacity="0.82"/>
  <circle cx="100" cy="20"  r="20" fill="#160a04" opacity="0.78"/>
  <circle cx="150" cy="46"  r="14" fill="#1a0c04" opacity="0.82"/>
  <circle cx="174" cy="100" r="17" fill="#160a04" opacity="0.78"/>
  <circle cx="148" cy="158" r="15" fill="#1a0c04" opacity="0.82"/>
  <circle cx="100" cy="178" r="18" fill="#160a04" opacity="0.78"/>
  <circle cx="50"  cy="156" r="14" fill="#1a0c04" opacity="0.82"/>
  <circle cx="28"  cy="100" r="16" fill="#160a04" opacity="0.78"/>
  <!-- Crust top highlight -->
  <path d="M 26 72 Q 54 28 100 16 Q 146 4 168 44" fill="none" stroke="rgba(255,210,130,0.38)" stroke-width="5" stroke-linecap="round"/>
  <!-- Sauce base -->
  <circle cx="100" cy="100" r="74" fill="#c43020"/>
  <!-- Sauce shading -->
  <circle cx="86"  cy="86"  r="28" fill="#a01c10" opacity="0.45"/>
  <circle cx="115" cy="105" r="22" fill="#a01c10" opacity="0.4"/>
  <circle cx="96"  cy="120" r="24" fill="#b82818" opacity="0.38"/>
  <!-- Mozzarella blobs -->
  <ellipse cx="100" cy="92"  rx="32" ry="23" fill="#f4eada" opacity="0.96"/>
  <ellipse cx="72"  cy="108" rx="24" ry="17" fill="#f6edd8" opacity="0.93" transform="rotate(-12,72,108)"/>
  <ellipse cx="130" cy="104" rx="22" ry="16" fill="#f2e8d4" opacity="0.95" transform="rotate(10,130,104)"/>
  <ellipse cx="98"  cy="128" rx="26" ry="17" fill="#f4eada" opacity="0.92"/>
  <!-- Mozzarella browning -->
  <ellipse cx="98"  cy="87"  rx="18" ry="12" fill="#c8841a" opacity="0.22"/>
  <!-- Basil leaves -->
  <ellipse cx="96"  cy="82"  rx="12" ry="7" fill="#206828" transform="rotate(-35,96,82)"/>
  <ellipse cx="95"  cy="81"  rx="12" ry="7" fill="#289030" transform="rotate(-35,95,81)"/>
  <line x1="89" y1="87" x2="102" y2="77" stroke="#145020" stroke-width="1.2" opacity="0.8"/>
  <ellipse cx="124" cy="118" rx="10" ry="6" fill="#289030" transform="rotate(20,124,118)"/>
  <ellipse cx="72"  cy="116" rx="9"  ry="5" fill="#289030" transform="rotate(-15,72,116)"/>
  <!-- Oven blisters -->
  <circle cx="86"  cy="76"  r="4.5" fill="#120804" opacity="0.5"/>
  <circle cx="117" cy="82"  r="4"   fill="#120804" opacity="0.45"/>
  <circle cx="112" cy="136" r="4"   fill="#120804" opacity="0.45"/>
  <!-- Oregano sprinkle -->
  <circle cx="82"  cy="104" r="2"   fill="#4a6e20" opacity="0.7"/>
  <circle cx="118" cy="94"  r="1.8" fill="#4a6e20" opacity="0.65"/>
  <circle cx="104" cy="118" r="1.8" fill="#4a6e20" opacity="0.65"/>
</svg>
