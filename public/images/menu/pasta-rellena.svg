<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Plate shadow -->
  <ellipse cx="100" cy="168" rx="64" ry="8" fill="rgba(0,0,0,0.3)"/>
  <!-- White plate -->
  <circle cx="100" cy="140" r="66" fill="#e8e2d4"/>
  <circle cx="100" cy="140" r="58" fill="#f4f0e4"/>

  <!-- Tortellini pieces arranged on plate -->
  <!-- Tortellino shape: a ring pinched in the middle -->

  <!-- Tortellino 1 (center) -->
  <path d="M 84 120 Q 100 112 116 120 Q 124 130 116 138 Q 100 145 84 138 Q 76 130 84 120 Z" fill="#f0d060"/>
  <path d="M 88 124 Q 100 118 112 124 Q 118 130 112 136 Q 100 141 88 136 Q 82 130 88 124 Z" fill="#e8c850"/>
  <path d="M 94 116 Q 100 112 106 116" fill="none" stroke="#c8a030" stroke-width="2" stroke-linecap="round"/>
  <path d="M 94 144 Q 100 148 106 144" fill="none" stroke="#c8a030" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center pinch -->
  <ellipse cx="100" cy="130" rx="5" ry="6" fill="#c8a030"/>
  <!-- Filling peek -->
  <ellipse cx="100" cy="130" rx="3" ry="3.5" fill="#f2e8d0" opacity="0.7"/>

  <!-- Tortellino 2 (top-left) -->
  <path d="M 56 90 Q 70 82 84 90 Q 90 98 84 106 Q 70 112 56 106 Q 50 98 56 90 Z" fill="#f0d060" transform="rotate(-20,70,96)"/>
  <path d="M 60 94 Q 70 88 80 94 Q 84 100 80 106 Q 70 110 60 106 Q 56 100 60 94 Z" fill="#e8c850" transform="rotate(-20,70,100)"/>
  <ellipse cx="70" cy="98" rx="4" ry="5" fill="#c8a030" transform="rotate(-20,70,98)"/>

  <!-- Tortellino 3 (top-right) -->
  <path d="M 116 90 Q 130 82 144 90 Q 150 98 144 106 Q 130 112 116 106 Q 110 98 116 90 Z" fill="#f0d060" transform="rotate(15,130,96)"/>
  <path d="M 120 94 Q 130 88 140 94 Q 144 100 140 106 Q 130 110 120 106 Q 116 100 120 94 Z" fill="#e8c850" transform="rotate(15,130,100)"/>
  <ellipse cx="130" cy="98" rx="4" ry="5" fill="#c8a030" transform="rotate(15,130,98)"/>

  <!-- Tortellino 4 (bottom-left) -->
  <path d="M 62 148 Q 76 140 90 148 Q 96 156 90 164 Q 76 170 62 164 Q 56 156 62 148 Z" fill="#f0d060" transform="rotate(-10,76,156)"/>
  <ellipse cx="76" cy="156" rx="4" ry="5" fill="#c8a030" transform="rotate(-10,76,156)"/>

  <!-- Tortellino 5 (bottom-right) -->
  <path d="M 110 148 Q 124 140 138 148 Q 144 156 138 164 Q 124 170 110 164 Q 104 156 110 148 Z" fill="#f0d060" transform="rotate(10,124,156)"/>
  <ellipse cx="124" cy="156" rx="4" ry="5" fill="#c8a030" transform="rotate(10,124,156)"/>

  <!-- Butter-sage sauce -->
  <path d="M 66 132 Q 100 126 134 132" fill="none" stroke="rgba(200,160,40,0.45)" stroke-width="8" stroke-linecap="round"/>
  <path d="M 72 142 Q 100 137 128 143" fill="none" stroke="rgba(200,160,40,0.35)" stroke-width="6" stroke-linecap="round"/>

  <!-- Sage leaves -->
  <ellipse cx="82"  cy="128" rx="9" ry="5" fill="#5a8040" opacity="0.85" transform="rotate(-25,82,128)"/>
  <ellipse cx="118" cy="126" rx="8" ry="4.5" fill="#5a8040" opacity="0.82" transform="rotate(20,118,126)"/>

  <!-- Parmigiano -->
  <ellipse cx="100" cy="116" rx="8" ry="3.5" fill="#f8f0d8" opacity="0.85" transform="rotate(-10,100,116)"/>
  <ellipse cx="116" cy="134" rx="6" ry="3"   fill="#f0e8d0" opacity="0.8" transform="rotate(22,116,134)"/>
</svg>
