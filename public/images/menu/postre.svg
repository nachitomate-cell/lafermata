<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Glass shadow -->
  <ellipse cx="100" cy="170" rx="44" ry="6" fill="rgba(0,0,0,0.35)"/>

  <!-- Tiramisù glass (rect with rounded top) -->
  <!-- Glass body -->
  <path d="M 62 72 L 58 164 Q 58 170 100 170 Q 142 170 142 164 L 138 72 Z" fill="rgba(255,255,255,0.1)" stroke="rgba(245,240,232,0.25)" stroke-width="1.5"/>

  <!-- Ladyfinger layer (espresso-soaked, dark coffee base) -->
  <rect x="62" y="130" width="76" height="34" rx="3" fill="#3a2418"/>
  <rect x="64" y="132" width="72" height="30" rx="2" fill="#4a2e1a"/>
  <!-- Ladyfinger texture lines -->
  <line x1="66" y1="140" x2="134" y2="140" stroke="#3a2418" stroke-width="1.2" opacity="0.7"/>
  <line x1="66" y1="148" x2="134" y2="148" stroke="#3a2418" stroke-width="1.2" opacity="0.7"/>
  <!-- Coffee soak -->
  <rect x="64" y="132" width="72" height="8" rx="2" fill="#2a1a0c" opacity="0.5"/>

  <!-- Mascarpone cream layer 1 -->
  <rect x="62" y="105" width="76" height="27" rx="2" fill="#f4ecd8"/>
  <!-- Cream texture -->
  <path d="M 68 112 Q 100 108 132 113" fill="none" stroke="rgba(200,185,155,0.4)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 68 118 Q 100 115 132 120" fill="none" stroke="rgba(200,185,155,0.35)" stroke-width="2" stroke-linecap="round"/>
  <!-- Cream highlight -->
  <path d="M 68 108 Q 100 105 132 108" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-linecap="round"/>

  <!-- Second ladyfinger layer -->
  <rect x="62" y="83" width="76" height="24" rx="2" fill="#3a2418"/>
  <rect x="64" y="85" width="72" height="20" rx="2" fill="#4a2e1a"/>
  <line x1="66" y1="91"  x2="134" y2="91"  stroke="#3a2418" stroke-width="1.2" opacity="0.7"/>
  <line x1="66" y1="97"  x2="134" y2="97"  stroke="#3a2418" stroke-width="1.2" opacity="0.7"/>

  <!-- Top mascarpone layer -->
  <rect x="62" y="64" width="76" height="21" rx="2" fill="#f8f2e4"/>
  <!-- Cocoa powder dusting (iconic tiramisù top) -->
  <rect x="62" y="64" width="76" height="21" rx="2" fill="#4a2010" opacity="0.35"/>
  <!-- Cocoa texture -->
  <circle cx="76"  cy="73" r="1.8" fill="#2a1008" opacity="0.55"/>
  <circle cx="88"  cy="70" r="1.5" fill="#2a1008" opacity="0.5"/>
  <circle cx="100" cy="73" r="2"   fill="#2a1008" opacity="0.55"/>
  <circle cx="112" cy="70" r="1.5" fill="#2a1008" opacity="0.5"/>
  <circle cx="124" cy="73" r="1.8" fill="#2a1008" opacity="0.55"/>
  <circle cx="82"  cy="77" r="1.5" fill="#2a1008" opacity="0.48"/>
  <circle cx="94"  cy="75" r="1.5" fill="#2a1008" opacity="0.48"/>
  <circle cx="106" cy="77" r="1.5" fill="#2a1008" opacity="0.48"/>
  <circle cx="118" cy="75" r="1.5" fill="#2a1008" opacity="0.48"/>
  <!-- Top cream highlight stripe -->
  <path d="M 66 66 Q 100 63 134 66" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" stroke-linecap="round"/>

  <!-- Glass sheen (side reflection) -->
  <path d="M 64 78 L 62 152" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 136 80 L 138 150" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-linecap="round"/>

  <!-- Cocoa sifter icon (tiny fork) above glass -->
  <circle cx="158" cy="60" r="10" fill="rgba(201,168,76,0.15)" stroke="rgba(201,168,76,0.4)" stroke-width="1"/>
  <text x="158" y="64" text-anchor="middle" font-size="11" fill="#c9a84c" font-family="serif">T</text>
</svg>
