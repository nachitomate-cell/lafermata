  <ellipse cx="114" cy="83" rx="4.5" ry="3" fill="#3a1a08" transform="rotate(15,114,83)"/>
  <line x1="111" y1="85" x2="118" y2="81" stroke="#6a3818" stroke-width="1" opacity="0.7"/>
