  <line x1="110" y1="98" x2="110" y2="116" stroke="#6a3810" stroke-width="1.5" opacity="0.6"/>
  <line x1="126" y1="98" x2="126" y2="116" stroke="#6a3810" stroke-width="1.5" opacity="0.6"/>
  <!-- Top cream layer -->
