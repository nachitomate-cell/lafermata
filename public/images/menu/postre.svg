  <circle cx="82" cy="83" r="1.2" fill="#3a1808" opacity="0.35"/>
  <circle cx="92" cy="87" r="1.4" fill="#3a1808" opacity="0.4"/>
  <circle cx="103" cy="84" r="1.3" fill="#3a1808" opacity="0.35"/>
  <circle cx="114" cy="86" r="1.5" fill="#3a1808" opacity="0.4"/>
  <circle cx="124" cy="83" r="1.2" fill="#3a1808" opacity="0.35"/>
